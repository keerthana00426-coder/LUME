<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember & Grounds | Specialty Café & Roastery</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        /* --- CSS Variables & Reset --- */
        :root {
            --bg-cream: #FAF6F0;
            --bg-sand: #F2EBE1;
            --espresso: #231812;
            --roast: #3D2B22;
            --terracotta: #B86B43;
            --terracotta-dark: #9A5532;
            --sage: #5E6E58;
            --text-muted: #665A52;
            --white: #FFFFFF;
            --border-light: rgba(35, 24, 18, 0.1);
            
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-cream);
            color: var(--espresso);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .brand-logo {
            font-family: var(--font-serif);
            font-weight: 700;
            line-height: 1.15;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-padding {
            padding: 100px 0;
        }

        .section-header {
            text-align: center;
            max-width: 600px;
            margin: 0 auto 60px;
        }

        .section-subtitle {
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--terracotta);
            margin-bottom: 12px;
        }

        .section-title {
            font-size: clamp(2.2rem, 4vw, 3.2rem);
            color: var(--espresso);
            margin-bottom: 16px;
        }

        .section-desc {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* --- Buttons --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
        }

        .btn-primary {
            background-color: var(--terracotta);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--terracotta-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(184, 107, 67, 0.25);
        }

        .btn-outline {
            border-color: var(--white);
            color: var(--white);
            background: transparent;
        }

        .btn-outline:hover {
            background-color: var(--white);
            color: var(--espresso);
        }

        /* --- Navigation --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 20px 0;
            transition: var(--transition);
        }

            background-color: rgba(250, 246, 240, 0.95);
            backdrop-filter: blur(10px);
            padding: 14px
